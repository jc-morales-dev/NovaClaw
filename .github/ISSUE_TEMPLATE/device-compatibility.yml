name: Device compatibility report
description: Report a real-device pass or failure without exposing credentials or personal data.
title: "[Device]: "
labels:
  - device-compatibility
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing NovaClaw on real hardware. Remove API keys, auth tokens,
        contacts, precise location, and other personal data from every attachment.
  - type: input
    id: device
    attributes:
      label: Device manufacturer and model
      placeholder: OPPO CPH2557
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 15
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - arm64-v8a
        - armeabi-v7a
        - x86_64
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NovaClaw release or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Pass
        - Partial pass
        - Fail
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks completed
      options:
        - label: Linux bootstrap completed
        - label: Built-in terminal opened
        - label: '`uname -a` completed'
        - label: '`node --version` completed'
        - label: A simple agent turn completed
  - type: textarea
    id: output
    attributes:
      label: Results and redacted evidence
      description: Include terminal output, connector results, and reproduction steps. Redact all credentials and personal data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys, tokens, contacts, precise location, and other personal data.
          required: true
